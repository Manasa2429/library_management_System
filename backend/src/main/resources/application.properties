# ===============================
# Server Configuration
# ===============================
server.port=8081

# ===============================
# MongoDB Configuration (Supports MongoDB Atlas or Local MongoDB)
# Set your MongoDB Atlas connection string here or via the MONGODB_URI environment variable:
# e.g. mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/library_db?retryWrites=true&w=majority
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/library_db}
spring.data.mongodb.auto-index-creation=true

# ===============================
# Static File & Uploads Configuration
# ===============================
spring.web.resources.static-locations=file:uploads/,classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# JWT Security Configuration
# ===============================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expirationMs=86400000

# ===============================
# Default Admin Seed Account
# ===============================
app.admin.name=Library Administrator
app.admin.email=admin@library.com
app.admin.password=Admin@123
app.admin.phone=+1234567890

# ===============================
# Library Lending & Fine Rules
# ===============================
library.fine.per-day=10.0
library.borrow.default-days=14
library.reservation.expiry-days=3
library.max-borrow-limit=5

# ===============================
# Mail Configuration (Optional / Fallback)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=true

# ===============================
# Frontend Client URL Configuration
# ===============================
app.client.url=${CLIENT_URL:http://localhost:3000}

# ===============================
# Springdoc / Swagger OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

