<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="60%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gradient -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Golden Bookmark Star / Beacon -->
  <path d="M32 9 L34.2 14.5 L40.2 15.1 L35.7 19.1 L37 25 L32 21.8 L27 25 L28.3 19.1 L23.8 15.1 L29.8 14.5 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Open Book Pages Left & Right -->
  <!-- Left Page -->
  <path d="M32 49 C26 44.5 19 43.5 12 44 C11.4 44 11 43.5 11 42.9 L11 25.5 C11 24.9 11.5 24.5 12.1 24.5 C18 24 25.5 25.5 32 30.5 Z" fill="#ffffff" filter="url(#glow)"/>
  <!-- Right Page -->
  <path d="M32 49 C38 44.5 45 43.5 52 44 C52.6 44 53 43.5 53 42.9 L53 25.5 C53 24.9 52.5 24.5 51.9 24.5 C46 24 38.5 25.5 32 30.5 Z" fill="#e0e7ff" filter="url(#glow)"/>

  <!-- Book Spine Center Divider -->
  <line x1="32" y1="29.5" x2="32" y2="49" stroke="#4338ca" stroke-width="2" stroke-linecap="round"/>

  <!-- Elegant Page Accent Lines -->
  <path d="M16 31 C21 31 26 32.5 29 34.5" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 36 C21 36 26 37.5 29 39.5" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round"/>
  
  <path d="M48 31 C43 31 38 32.5 35 34.5" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M48 36 C43 36 38 37.5 35 39.5" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
</svg>
